<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Student Grade Calculator</h1>
    <p>Calculate your final grade!</p>

    <form>
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Enter your name" />

      <label for="grade">Your Grade (out of 20)</label>
      <input
        type="number"
        id="grade"
        placeholder="Enter your grade"
        value="0"
      />

      <label for="bonus">Bonus Points</label>
      <input type="number" id="bonus" placeholder="Enter bonus points" />

      <button type="submit">Calculate Result</button>
    </form>

    <h2>Result</h2>
    <p id="result">Your result will appear here.</p>

    <script src="script.js"></script>
  </body>
</html>
